<main class="max-w-5xl mx-auto p-4 md:p-8">
  <header class="mb-8 border-b-4 border-f1-red pb-4">
    <div class="flex items-center gap-3 mb-1">
      <span class="w-3 h-6 bg-f1-red inline-block transform -skew-x-12"></span>
      <span class="text-xs font-black tracking-widest text-f1-red uppercase">Official Grid</span>
    </div>
    <h1 class="text-3xl md:text-5xl font-black italic tracking-tighter uppercase text-white">
      CHAMPIONSHIP <span class="text-f1-red">DRIVERS</span>
    </h1>
  </header>
    @if (loading()) {
    <div class="text-center py-16 bg-f1-surface border border-f1-border rounded-sm">
      <div class="inline-block w-8 h-8 border-4 border-f1-red border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="font-bold tracking-widest text-xs text-gray-300 uppercase italic">Cargando Telemetría & Tiempos de vuelta...</p>
    </div>
  }

  <!-- Mensaje de Error -->
  @if (error()) {
    <div class="p-4 mb-6 bg-red-950/50 border-l-4 border-f1-red text-red-200 text-sm font-semibold uppercase">
      {{ error() }}
    </div>
  }
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    @for (p of pilots(); track p.id) {
      <a [routerLink]="['/pilotos', p.id]"
       class="bg-f1-surface border border-f1-border rounded-sm p-5 relative overflow-hidden group hover:border-f1-red transition-all block cursor-pointer">
        <!-- Racing Number Background -->
        <span class="absolute -right-2 -bottom-4 text-7xl font-black italic text-white/5 select-none pointer-events-none">
          #{{ p.number }}
        </span>

        <div class="flex items-center gap-4 relative z-10">
          <div class="w-14 h-14 rounded-full bg-[#111118] border-2 border-f1-border overflow-hidden flex items-center justify-center">
            @if (p.avatar_url) {
              <img [src]="p.avatar_url" [alt]="p.name" class="w-full h-full object-cover" referrerpolicy="no-referrer">
            } @else {
              <span class="font-black italic text-f1-red text-lg">#{{ p.number }}</span>
            }
          </div>

          <div>
            <h3 class="font-black italic uppercase text-lg text-white group-hover:text-f1-red transition-colors">
              {{ p.name }} {{p.surname}}
            </h3>
            <span class="text-xs font-bold uppercase tracking-wider text-f1-red block">
              {{ p.nickname || '-' }}
            </span>
          </div>
        </div>
      </a>
    }
  </div>
</main>

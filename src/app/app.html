<nav class="bg-[#111118] border-b border-f1-border px-4 py-3 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
    <!-- Brand -->
    <a routerLink="/" class="flex items-center gap-2">
      <span class="font-black italic text-xl tracking-tighter text-white">Torneo<span class="text-f1-red">SinFrenos</span></span>
    </a>

    <!-- Rutas -->
    <div class="flex items-center gap-1 md:gap-3">
      <a routerLink="/"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="!border-f1-red !text-white bg-f1-surface"
         class="px-3 py-1.5 text-xs font-black uppercase tracking-wider text-gray-400 border-b-2 border-transparent hover:text-white transition-all">
        Home
      </a>
      <a routerLink="/tabla-posiciones"
         [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="!border-f1-red !text-white bg-f1-surface"
         class="px-3 py-1.5 text-xs font-black uppercase tracking-wider text-gray-400 border-b-2 border-transparent hover:text-white transition-all">
        Tabla de posiciones
      </a>
      <a routerLink="/carreras"\
       [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="!border-f1-red !text-white bg-f1-surface"
         class="px-3 py-1.5 text-xs font-black uppercase tracking-wider text-gray-400 border-b-2 border-transparent hover:text-white transition-all">
        Carreras
      </a>
      <a routerLink="/pilotos"
       [routerLinkActiveOptions]="{ exact: true }"
         routerLinkActive="!border-f1-red !text-white bg-f1-surface"
         class="px-3 py-1.5 text-xs font-black uppercase tracking-wider text-gray-400 border-b-2 border-transparent hover:text-white transition-all">
        Pilotos
      </a>
    </div>

    <!-- Quick Season Selector en Nav -->
    <div class="flex items-center gap-1 bg-f1-surface px-2 py-1 border border-f1-border rounded-sm">
      <span class="text-[10px] font-black uppercase text-gray-400">Temporada:</span>
      <select
        [value]="activeSeason()"
        (change)="changeSeason(+$any($event.target).value)"
        class="bg-transparent text-white text-xs font-black italic outline-none cursor-pointer">
        @for (temp of seasons(); track temp) {
          <option [value]="temp" class="bg-[#111118] text-white">{{ temp }}</option>
        }
      </select>
    </div>
  </div>
</nav>

<router-outlet />
